  <text x="44" y="62" font-size="12" font-style="italic" fill="#CFCECD">Its really big project for a one man team, to also cover such wide</text><text x="44" y="80" font-size="12" font-style="italic" fill="#CFCECD">range of technologies.</text>
  <text x="44" y="112" font-size="11" fill="#656363">— moreorover, Better-Fullstack community</text>
  
  <text x="512" y="66" font-size="24" fill="#E8612D" opacity="0.8">"</text>
  <text x="540" y="62" font-size="12" font-style="italic" fill="#CFCECD">I hope your library will grow and get more attention.</text>
