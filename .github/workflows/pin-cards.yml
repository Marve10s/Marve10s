name: Update pin cards

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pin-cards.yml"
      - "profile/generate-pins.mjs"

concurrency:
  group: pin-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate pin cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node profile/generate-pins.mjs

      - name: Commit pin cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/pins profile/heatmap.svg profile/quotes.svg
          git commit -m "Update pin cards [skip ci]" || exit 0
          git push
